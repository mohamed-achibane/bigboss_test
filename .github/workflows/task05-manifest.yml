name: Task 05 Formatted Manifest

on:
  push:
    branches:
      - task04-ci-harness-20260826

permissions:
  contents: write

jobs:
  manifest:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build target tree manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('task04-harness')
          groups = {
              'task05-manifest-config.json': [
                  'apps/web/package.json',
                  'apps/web/next.config.ts',
                  'apps/web/src/app/globals.css',
                  'apps/web/src/styles/tokens.css',
                  'apps/web/src/styles/globals.css',
                  'packages/ui/package.json',
                  'packages/ui/tsconfig.json',
                  'packages/ui/eslint.config.mjs',
                  'packages/ui/src/lib/cn.ts',
                  'packages/ui/src/styles/tokens.css',
              ],
              'task05-manifest-primitives.json': [
                  'packages/ui/src/components/accordion.tsx',
                  'packages/ui/src/components/badge.tsx',
                  'packages/ui/src/components/button.tsx',
                  'packages/ui/src/components/callout.tsx',
                  'packages/ui/src/components/card.tsx',
                  'packages/ui/src/components/dialog.tsx',
                  'packages/ui/src/components/navigation-menu.tsx',
                  'packages/ui/src/components/tabs.tsx',
                  'packages/ui/src/components/tooltip.tsx',
              ],
              'task05-manifest-patterns.json': [
                  'packages/ui/src/components/control-panel-frame.tsx',
                  'packages/ui/src/components/feature-status-badge.tsx',
                  'packages/ui/src/components/hosting-comparison-table.tsx',
                  'packages/ui/src/components/hosting-pricing-card.tsx',
                  'packages/ui/src/components/layout-patterns.tsx',
                  'packages/ui/src/index.ts',
                  'apps/web/src/components/design-system/design-system-fixture.tsx',
                  'apps/web/src/app/page.tsx',
                  'pnpm-lock.yaml',
              ],
          }

          for output, paths in groups.items():
              elements = []
              for path in paths:
                  elements.append({
                      'path': path,
                      'mode': '100644',
                      'type': 'blob',
                      'content': (root / path).read_text(),
                  })
              Path(output).write_text(json.dumps(elements, ensure_ascii=False))
          PY

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task05-manifest-*.json
          git commit -m "chore: materialize Task 05 formatted manifests [skip ci]"
          git push
